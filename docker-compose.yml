services:
  bot:
    build:
      context: .
      network: host
    container_name: smeshniavka
    network_mode: host
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./backups:/app/backups
      - ./config:/app/config:ro
      # prompts/ на запись: живой банк стиля (style_examples*.yaml) дописывается ботом на лету
      - ./prompts:/app/prompts:rw
      - ./src:/app/src:ro
    healthcheck:
      test: ["CMD", "python", "-m", "src.tools.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
