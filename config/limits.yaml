  max_bytes: 2097152    # 2 MB
  max_seconds: 180      # 180s
video:
  max_bytes: 15728640   # 15 MB
  max_seconds: 60       # Первые 60s
video_note:
  max_bytes: 15728640   # 15 MB
  max_seconds: 60       # Первые 60s
audio:
  max_bytes: 10485760   # 10 MB
photo:
  max_bytes: 5242880    # 5 MB
animation:
  max_bytes: 5242880    # 5 MB
  max_seconds: 10
doc:
  allowed: false
