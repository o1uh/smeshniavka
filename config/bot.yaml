# Основной конфиг «Смешнявки»
# Числовые лимиты соответствуют спецификации R1-R13

ALLOWED_CHAT_ID: 0 # ID целевого чата из discover (отрицательный для супергрупп)
OWNER_IDS: []      # ID владельцев бота (также могут быть заданы через env OWNER_IDS=123,456)
MODEL_ID: "fast"   # Быстрейшая модель через Antigravity Fast Bridge (алиас gemini-3.8-flash-low)
BRIDGE_URL: "http://127.0.0.1:8000" # URL моста на RPi (или http://rpi.ln:8000 при внешнем запуске)
TZ: "Asia/Novosibirsk"
BOT_ALIASES: ["смешняв", "смешнявка"]
SAFETY: "all OFF"
PII_SCRUB: true
LOG_CONTENT: false

# Concurrency & priorities
MAX_CONCURRENT: 4
RPM_P0_RESERVE: 5
BUDGET_P2_MAX: 70
BUDGET_P1_MAX: 90

# Lane workers: chat — дефолтное общение, track — треки, media — остальное.
# Сумма лимитов <= MAX_CONCURRENT: медленная гифка не душит чат.
CHAT_MAX_CONCURRENT: 2
TRACK_MAX_CONCURRENT: 1
MEDIA_MAX_CONCURRENT: 1
# System lane: фон P2 (досье, style_filter)
SYS_MAX_CONCURRENT: 1
WORKER_QUEUE_MAX: 30
CHAT_TIMEOUT_S: 35.0
TRACK_TIMEOUT_S: 50.0
MEDIA_TIMEOUT_S: 75.0
SYS_TIMEOUT_S: 75.0
TYPING_KEEPALIVE_S: 4.0
# Media preprocessing перед отправкой на мост
PHOTO_MAX_DIM: 1280
PHOTO_JPEG_Q: 72
VIDEO_MAX_S: 20
VIDEO_HEIGHT: 480
ANIM_MAX_S: 4
ANIM_HEIGHT: 480

# Ping policy
PING_LIMIT: 20
PING_WINDOW_S: 60
PING_QUEUE_MAX: 30
PING_QUEUE_TTL_S: 300
RATE_NOTICE_COOLDOWN_S: 120
TG_SEND_PER_MIN: 18
TG_SEND_QUEUE_MAX: 100
FOLLOWUP_WINDOW_S: 20

# Proactive policy
PROACTIVE_MIN: 30
PROACTIVE_MAX: 80
RANDOM_P: 0.05
PROACTIVE_ACTIVE_MIN: 15
COOLDOWN_S: 120
PROACTIVE_MAX_PER_HOUR: 2
PROACTIVE_MAX_PER_DAY: 6
NIGHT_START: "03:00"
NIGHT_END: "07:00"

# Media policy
MEDIA_AUTO_PER_DAY: 300
MEDIA_AUTO_ANALYZE_P:
  voice: 1.0
  video_note: 1.0
  video: 0.3
  photo: 0.3
  audio: 0.0
  animation: 0.0
MEDIA_AUTO_REACT_VIDEO_P: 0.05
MEDIA_AUTO_REACT_AUDIO_P: 0.15
MEDIA_AUTO_REACT_VOICE_P: 0.05
MEDIA_AUTO_REACT_VIDEO_NOTE_P: 0.05
MEDIA_AUTO_REACT_PHOTO_P: 0.03
MEDIA_AUTO_REACT_ANIMATION_P: 0.03

# Context & history
CTX_LAST: 60
SUMMARY_TOK: 800
CHUNK_SUMMARY_TOK: 300
THREAD_CHAIN_DEPTH: 3
THREAD_NEIGHBORS: 10

# Dossier
DOSSIER_EVERY: 40
DOSSIER_MAX_WINDOW: 120
DOSSIER_CONSOLIDATE_EVERY: "24h"
RECENT_TTL_DAYS: 30
CLAIM_MIN_COUNT: 3
DOSSIER_SLICES_MAX: 5
STYLE_EXAMPLES_N: 8
STYLE_FILTER_BATCH: 30
# Живой банк стиля: сбор фраз чата в кандидаты + промоушн через style_filter
STYLE_LEARN_ENABLED: true
STYLE_MIN_LEN: 6
STYLE_MAX_LEN: 150
STYLE_EXAMPLES_MAX: 128
# Пермач банка стиля (не вытесняется)
STYLE_PINNED_SEEDS: ["бум"]

# Research
SEARCH_FORCE_TRIGGERS: ["загугли", "погугли", "прогугли", "ресерч", "ресёрч", "поищи", "новости", "пруф", "чекни"]
# Смеяки как сигнал качества для банка стиля (прайм-кандидаты):
# 3+ distinct — сразу в банк-пермач, 1–2 — в очередь на отбор
REACT_LAUGH_THRESHOLD: 3
REACT_LAUGH_EMOJIS: ["😁", "😂", "🤣", "😆", "😹", "🤭"]
LINK_TRIGGERS: ["что за", "о чём", "пруф", "суть"]
LINK_TRIGGERS_SHOW: ["загугли", "прогугли", "пруф", "дай ссылку", "источник"]
RESEARCH_TTL_H: 72
RESEARCH_CACHE_MAX: 1000

# Cache & Retention
MEDIA_CACHE_MAX: 2000
MSG_RETENTION_DAYS: 30
MSG_RETENTION_ROWS: 20000
IMPORT_MAX_DAYS: 30
IMPORT_DOSSIER_WINDOW: 400
IMPORT_MAX_CALLS: 300
STALE_UPDATE_S: 120

# Operations
SHADOW_MODE: false
ALERT_KEYS_DOWN_S: 600
ALERT_DISK_MIN_MB: 500
ALERT_COOLDOWN_S: 3600
CONFLICT_MAX_WAIT_S: 900
